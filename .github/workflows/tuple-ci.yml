name: Platform tuple CI preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Full recorded Platform candidate SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current-source: ${{ steps.sources.outputs.current-source }}
    env:
      PLATFORM_CANDIDATE_SHA: ${{ inputs.candidate-sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate-sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Resolve the exact candidate before execution
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLATFORM_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PLATFORM_CANDIDATE_SHA"
          python3 -B eng/test_current_tuple_source.py
          python3 -B - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'eng')
          from current_tuple_source import read_selection
          read_selection(Path.cwd(), os.environ['PLATFORM_CANDIDATE_SHA'])
          PYCODE
          printf 'current-source=%s\n' "$PLATFORM_CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Run offline cluster-management unit tests
        shell: bash
        run: |
          set -euo pipefail
          command -v ssh-keygen
          python3 -m venv "$RUNNER_TEMP/cluster-management-venv"
          python="$RUNNER_TEMP/cluster-management-venv/bin/python"
          "$python" -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          "$python" -B -m unittest discover -s eng/cluster-management -p 'test_*.py'
      - name: Run GitHub review decision transport controls
        run: python3 -B -m unittest discover -s eng -p test_github_decisions.py
      - name: Check the append-only module intake manifest
        env:
          MODULE_INTAKE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B eng/test_module_intake.py
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # Read the first parent from the commit header even at checkout depth 1.
            MODULE_INTAKE_BASE="$(git cat-file commit "$PLATFORM_CANDIDATE_SHA" | awk '/^$/ { body = 1 } !body && /^parent / && !printed { print $2; printed = 1 }')"
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$MODULE_INTAKE_BASE" == 0000000000000000000000000000000000000000 ]]; then
            python3 -B eng/module_intake.py --check
            exit 0
          fi
          [[ "$MODULE_INTAKE_BASE" =~ ^[0-9a-f]{40}$ && "$MODULE_INTAKE_BASE" != "$PLATFORM_CANDIDATE_SHA" ]]
          git fetch --depth=1 --no-tags --no-write-fetch-head --no-recurse-submodules --refmap= origin "$MODULE_INTAKE_BASE"
          python3 -B eng/module_intake.py --check --against "$MODULE_INTAKE_BASE"
      - name: Require the pinned Builds release tag to name the recorded gitlink
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B eng/builds_publication.py --revision "$PLATFORM_CANDIDATE_SHA"

  host-evidence:
    needs: [resolve-sources]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PLATFORM_CANDIDATE_SHA: ${{ needs.resolve-sources.outputs.current-source }}
      AGENTS_CONFIGURATION: Release
    steps:
      - name: Set run-owned evidence paths
        run: |
          evidence="$RUNNER_TEMP/platform-host-evidence"
          mkdir "$evidence"
          printf '{"candidate":"%s","configuration":"%s"}\n' "$PLATFORM_CANDIDATE_SHA" "$AGENTS_CONFIGURATION" > "$evidence/bootstrap.json"
          printf 'HOST_EVIDENCE=%s\nAGENTS_BUILDS_ROOT=%s\n' "$evidence" "$RUNNER_TEMP/platform-agents-builds" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-sources.outputs.current-source }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Initialize the pinned Builds and EventStore sources
        id: dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$PLATFORM_CANDIDATE_SHA"
          git -c submodule.recurse=false submodule update --init -- references/Hexalith.Builds references/Hexalith.EventStore
      - name: evidence-gate-tests
        working-directory: eng
        run: |
          python3 -m unittest test_verify_works_host test_works_toolchain test_verify_works_producer \
            test_isolated_daprd test_retained_works_host test_works_host_snapshot test_works_verifier_command \
            test_works_verifier_inputs test_works_managed_runtime test_bound_builds 2>&1 | tee "$HOST_EVIDENCE/evidence-gate-tests.log"
      - name: component-evidence-gate-tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: eng/ext-host-1
        run: python3 -m unittest test_verify_full test_prepare_acceptance 2>&1 | tee "$HOST_EVIDENCE/component-evidence-gate-tests.log"
      - name: Materialize the authenticated Agents Builds context
        id: agents-context
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          PYTHONPATH=eng python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from bound_builds import materialize

          root = Path.cwd()
          producer = materialize(root, os.environ['AGENTS_BUILDS_ROOT'], root / 'references/Hexalith.Builds')
          context = {'configuration': os.environ['AGENTS_CONFIGURATION'], 'producer': producer}
          (Path(os.environ['HOST_EVIDENCE']) / 'agents-context.json').write_text(json.dumps(context, indent=2) + '\n')
          PY
      - name: Bind the verified published Builds tool for Agents
        id: agents-tooling
        if: ${{ !cancelled() && steps.agents-context.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool="$(python3 -B eng/prepare_builds_artifacts.py --require-recorded --output "$HOST_EVIDENCE/agents-builds")"
          printf 'HexalithBuildsPublishedToolRoot=%s\n' "$tool" >> "$GITHUB_ENV"
      - name: agents-full-refusal
        if: ${{ !cancelled() && steps.agents-tooling.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          log="$HOST_EVIDENCE/agents-full-refusal.log"
          status=0
          bash eng/verify-agents-host.sh --configuration "$AGENTS_CONFIGURATION" --builds-root "$AGENTS_BUILDS_ROOT" \
            --artifacts-path "$HOST_EVIDENCE/agents-full" > "$log" 2>&1 || status=$?
          cat "$log"
          if [[ "$status" != 1 ]] || ! grep -Fq 'DependencyNotAvailable: EXT-HOST-1' "$log"; then
            echo "Expected the Agents Full EXT-HOST-1 refusal with exit code 1, got exit code $status."
            exit 1
          fi
      - name: agents-local-scaffold
        if: ${{ !cancelled() && steps.agents-tooling.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          bash eng/verify-agents-host.sh --mode LocalScaffold --configuration "$AGENTS_CONFIGURATION" \
            --builds-root "$AGENTS_BUILDS_ROOT" --artifacts-path "$HOST_EVIDENCE/agents-local" \
            2>&1 | tee "$HOST_EVIDENCE/agents-local-scaffold.log"
      - name: Recheck the authenticated Agents Builds context
        if: ${{ !cancelled() && steps.agents-context.outcome == 'success' }}
        run: |
          PYTHONPATH=eng python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from bound_builds import verify_bound_checkout

          context = json.loads((Path(os.environ['HOST_EVIDENCE']) / 'agents-context.json').read_text())
          if verify_bound_checkout(Path.cwd(), os.environ['AGENTS_BUILDS_ROOT']) != context['producer']:
              raise SystemExit('The authenticated Agents producer context changed during execution')
          PY
      - name: Retain successful and failed Platform host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-host-evidence/*.json
            ${{ runner.temp }}/platform-host-evidence/*.log
            ${{ runner.temp }}/platform-host-evidence/agents-builds/artifact-identity.json
            ${{ runner.temp }}/platform-host-evidence/agents-builds/signature.*
            ${{ runner.temp }}/platform-host-evidence/agents-full/**/*.json
            ${{ runner.temp }}/platform-host-evidence/agents-full/**/*.log
            ${{ runner.temp }}/platform-host-evidence/agents-full/**/*.xml
            ${{ runner.temp }}/platform-host-evidence/agents-full/**/*.jsonl
            ${{ runner.temp }}/platform-host-evidence/agents-full/**/*.md
          if-no-files-found: error

  tuple:
    needs: [resolve-sources]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
      PLATFORM_CANDIDATE_SHA: ${{ needs.resolve-sources.outputs.current-source }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Retain bootstrap provenance before checkout and setup
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'platform-tuple-bootstrap'
          output.mkdir()
          keys = ['PLATFORM_CANDIDATE_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion']
          (output / 'bootstrap.json').write_text(json.dumps({'status': 'started-only', 'candidateAcceptance': False, 'context': {key: os.environ.get(key) for key in keys}}, indent=2))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: checkout
        with:
          ref: ${{ inputs.candidate-sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify automatic source release controls
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:source-release
          node --test eng/test-extension-release/gate.test.mjs
          python3 -B eng/test-extension-release/run-controls.py
          python3 -B eng/test_tuple_sdk_suites.py
          python3 -B eng/test_current_catalog_view.py UnifiedCatalogFaultTests
          python3 -B eng/test_builds_publication.py
          python3 -B eng/test_builds_tool_lock.py
      - name: Verify exact candidate and initialize only owner-declared direct dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="$RUNNER_TEMP/platform-tuple-bootstrap"
          exec > >(tee "$bootstrap/initialize.stdout") 2> >(tee "$bootstrap/initialize.stderr" >&2)
          trap 'code=$?; printf "%s\n" "$code" > "$bootstrap/initialize.exit"' EXIT
          [[ "$PLATFORM_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PLATFORM_CANDIDATE_SHA"
          # The pins must agree; the Builds checkout must then equal the recorded gitlink.
          builds_source="$(python3 -B eng/builds_tuple.py)"
          git submodule update --init
          test "$(git -C references/Hexalith.Builds rev-parse HEAD)" = "$builds_source"
      - name: Recheck the exact initialized Parties source and declaration
        run: |
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'eng')
          from current_tuple_source import verify_checkout
          import os
          verify_checkout(Path.cwd(), os.environ['PLATFORM_CANDIDATE_SHA'])
          PY
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        id: dotnet
        with:
          global-json-file: global.json
      - name: Require the owner package lock to equal the pinned catalog and nuget.org
        # Composition admits owner packages only through this lock; a stale or tampered lock refuses here.
        # Both read the initialized Builds catalog and Parties project closure at their recorded gitlinks.
        run: |
          python3 -B eng/test_owner_packages_lock.py
          python3 -B eng/owner_packages_lock.py --check
      - name: Verify published tuple, reject source fallback, build and test Release
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 eng/run_tuple_ci.py --evidence artifacts/tuple-ci-current --suite current
          python3 eng/run_tuple_ci.py --evidence artifacts/tuple-ci-base --suite base
          python3 eng/run_tuple_ci.py --evidence artifacts/tuple-ci-extensions --suite extensions
          dotnet test --project tests/Hexalith.Platform.Identity.Tests/Hexalith.Platform.Identity.Tests.csproj --configuration Release --no-build -- --filter-class 'Hexalith.Platform.Identity.Tests.PlatformIdentity*'
          dotnet test --project tests/Hexalith.Platform.Composition.Tests/Hexalith.Platform.Composition.Tests.csproj --configuration Release --no-build -- \
            --filter-method Hexalith.Platform.Composition.Tests.PlatformAppModelTests.CompositionRefusesDuplicateDeclarationNamesBeforeAddingResources \
            --filter-method Hexalith.Platform.Composition.Tests.PlatformAppModelTests.CompositionAllowsNamesReusedAcrossModulesCollectionsAndInterfaces \
            --filter-method Hexalith.Platform.Composition.Tests.PlatformAppModelTests.CompositionComparesResourceRequestsWithMatchingLimitsExactly \
            --filter-method Hexalith.Platform.Composition.Tests.PlatformAppModelTests.InvalidDependencyGraphRefusesBeforeResourceCreation \
            --filter-method Hexalith.Platform.Composition.Tests.PlatformAppModelTests.CompositionRefusesStructurallyValidCommandReadinessBeforeResourceCreation \
            --filter-method Hexalith.Platform.Composition.Tests.PlatformAppModelTests.HostedGraphRequiresPerEnvironmentProviderTenancy \
            --filter-method Hexalith.Platform.Composition.Tests.PlatformAppModelTests.PackageModeResolvesReleasedSyntheticTenantExecutable \
            --filter-method Hexalith.Platform.Composition.Tests.PlatformAppModelTests.SelectsOnlyTheDeclaredDependencyClosure
          dotnet test --project tests/Hexalith.Platform.Custody.Tests/Hexalith.Platform.Custody.Tests.csproj --configuration Release --no-build -- \
            --filter-class Hexalith.Platform.Custody.Tests.CustodyPrerequisiteTests \
            --filter-class Hexalith.Platform.Custody.Tests.PrivateOwnerOperationAuthenticatorTests \
            --filter-class Hexalith.Platform.Custody.Tests.DeletionCapabilitySigningActorTests
          dotnet test --project tests/Hexalith.Platform.Custody.Tests/Hexalith.Platform.Custody.Tests.csproj --configuration Release --no-build -- \
            --filter-method Hexalith.Platform.Custody.Tests.ReplicatedSecurityObservationSpoolTests.InvalidDrainCountRefusesBeforeAnyRead \
            --filter-method Hexalith.Platform.Custody.Tests.ReplicatedSecurityObservationSpoolTests.MalformedPendingTransitionFailsDrainWithoutMutation \
            --filter-method Hexalith.Platform.Custody.Tests.ReplicatedSecurityObservationSpoolTests.ForeignInstallationHeadFailsDrainWithoutMutation \
            --filter-method Hexalith.Platform.Custody.Tests.ReplicatedSecurityObservationSpoolTests.MalformedReservationLayoutsRefuseWithoutMutation \
            --filter-method Hexalith.Platform.Custody.Tests.ReplicatedSecurityObservationSpoolTests.StructurallyReadableDivergentReservedArchiveFailsDrain \
            --filter-method Hexalith.Platform.Custody.Tests.ReplicatedSecurityObservationSpoolWorkerTests.WorkerRetriesAfterMalformedHeadIsRepaired
      - name: Retain bootstrap and preflight outcomes
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SDK_OUTCOME: ${{ steps.dotnet.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'platform-tuple-bootstrap/bootstrap.json'
          record = json.loads(path.read_text())
          keys = ['CHECKOUT_OUTCOME', 'DEPENDENCIES_OUTCOME', 'SDK_OUTCOME', 'PREFLIGHT_OUTCOME']
          record['outcomes'] = {key: os.environ.get(key) for key in keys}
          record['status'] = 'completed' if all(value == 'success' for value in record['outcomes'].values()) else 'failed-or-incomplete'
          record['finishedUtc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          path.write_text(json.dumps(record, indent=2))
          PY
      - name: Retain successful and failed preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-tuple-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-tuple-bootstrap
            artifacts/tuple-ci-current
            artifacts/tuple-ci-base
            artifacts/tuple-ci-extensions
          if-no-files-found: error

  tuple-verdict:
    if: always()
    needs: [resolve-sources, host-evidence, tuple]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require source resolution and current execution
        env:
          SOURCE_RESULT: ${{ needs.resolve-sources.result }}
          HOST_EVIDENCE_RESULT: ${{ needs.host-evidence.result }}
          CURRENT_RESULT: ${{ needs.tuple.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$HOST_EVIDENCE_RESULT" = success
          test "$CURRENT_RESULT" = success
