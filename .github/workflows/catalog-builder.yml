name: Catalog builder consumer binding

on:
  push:
    branches: [main, fix/catalog-consumer-run-binding]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: catalog-builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consumer-binding:
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.130.0', '3.130.1', '3.130.2', '3.132.1', '4.1.0', '4.2.0']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize only the declared shared package catalog
        run: git -c submodule.recurse=false submodule update --init -- references/Hexalith.Builds
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Verify every finite capability gate once
        if: matrix.sdk == '3.132.1'
        run: >-
          python3 tests/catalog-builder/verify_sdk_gates.py
          --evidence "$RUNNER_TEMP/catalog-sdk-gates.json"
      - name: Build the owning tool against the published SDK without warnings
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/catalog-builder-nuget
        run: >-
          dotnet build src/Hexalith.Platform.CatalogBuilder/Hexalith.Platform.CatalogBuilder.csproj
          --configuration Release -warnaserror -m:1 -nr:false
          -p:UseHexalithProjectReferences=false -p:HexalithEventStoreVersion=${{ matrix.sdk }}
          -p:HexalithBuildsRoot="$GITHUB_WORKSPACE/references/Hexalith.Builds"
      - name: Qualify the actual executable against public SDK and owner artifacts
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/catalog-builder-nuget
        run: >-
          python3 tests/catalog-builder/verify_catalog_builder.py
          --builds-root "$GITHUB_WORKSPACE/references/Hexalith.Builds"
          --sdk-version "${{ matrix.sdk }}"
          --tenants-version "${{ matrix.sdk == '4.2.0' && '7.0.5' || matrix.sdk == '4.1.0' && '7.0.2' || '6.0.0' }}"
          --evidence "$RUNNER_TEMP/catalog-builder-evidence"
      - name: Verify closed current public owner cohorts before any runner execution
        if: matrix.sdk == '4.1.0'
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/catalog-builder-nuget
        run: >-
          python3 tests/catalog-builder/verify_public_owner_cohorts.py
          --builds-root "$GITHUB_WORKSPACE/references/Hexalith.Builds"
          --evidence "$RUNNER_TEMP/catalog-public-owner-evidence"
      - name: Verify the SDK4.2 no-extension private and full public owner readers
        if: matrix.sdk == '4.2.0'
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/catalog-builder-nuget
        run: >-
          python3 tests/catalog-builder/verify_sdk42_owner_cohorts.py
          --builds-root "$GITHUB_WORKSPACE/references/Hexalith.Builds"
          --evidence "$RUNNER_TEMP/catalog-sdk42-owner-evidence"
      - name: Verify the distinct SDK4.2 public Parties reader without image relabeling
        if: matrix.sdk == '4.2.0'
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/catalog-builder-nuget
        run: >-
          python3 tests/catalog-builder/verify_sdk420_public_parties.py
          --builds-root "$GITHUB_WORKSPACE/references/Hexalith.Builds"
          --evidence "$RUNNER_TEMP/catalog-sdk420-public-parties-evidence"
      - name: Retain executable and refusal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-builder-consumer-binding-${{ matrix.sdk }}
          path: |
            ${{ runner.temp }}/catalog-builder-evidence
            ${{ runner.temp }}/catalog-sdk-gates.json
            ${{ runner.temp }}/catalog-public-owner-evidence
            ${{ runner.temp }}/catalog-sdk42-owner-evidence
            ${{ runner.temp }}/catalog-sdk420-public-parties-evidence
          if-no-files-found: error
