name: Catalog builder consumer binding

on:
  push:
    branches: [main, fix/catalog-consumer-run-binding]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: catalog-builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consumer-binding:
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.130.0', '3.130.1']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize only the declared shared package catalog
        run: git -c submodule.recurse=false submodule update --init -- references/Hexalith.Builds
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Build the owning tool against the published SDK without warnings
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/catalog-builder-nuget
        run: >-
          dotnet build src/Hexalith.Platform.CatalogBuilder/Hexalith.Platform.CatalogBuilder.csproj
          --configuration Release -warnaserror -m:1 -nr:false
          -p:UseHexalithProjectReferences=false -p:HexalithEventStoreVersion=${{ matrix.sdk }}
          -p:HexalithBuildsRoot="$GITHUB_WORKSPACE/references/Hexalith.Builds"
      - name: Qualify the actual executable against public SDK and owner artifacts
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/catalog-builder-nuget
        run: >-
          python3 tests/catalog-builder/verify_catalog_builder.py
          --builds-root "$GITHUB_WORKSPACE/references/Hexalith.Builds"
          --sdk-version "${{ matrix.sdk }}"
          --evidence "$RUNNER_TEMP/catalog-builder-evidence"
      - name: Retain executable and refusal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-builder-consumer-binding-${{ matrix.sdk }}
          path: ${{ runner.temp }}/catalog-builder-evidence
          if-no-files-found: error
