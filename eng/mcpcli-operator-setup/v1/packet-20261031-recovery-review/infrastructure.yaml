apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcpcli-v1
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: task-bounds
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
spec:
  hard:
    pods: '4'
    persistentvolumeclaims: '1'
    requests.storage: 1Gi
    limits.cpu: '6'
    limits.memory: 3Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcpcli-task-secrets
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - mcpcli-jwt
  - mcpcli-eventstore-app
  - mcpcli-eventstore-api
  - mcpcli-tenants-app
  - mcpcli-tenants-api
  - mcpcli-parties-app
  - mcpcli-parties-api
  - mcpcli-redis
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcpcli-task-secrets
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcpcli-task-secrets
subjects:
- kind: ServiceAccount
  name: mcpcli-v1
  namespace: mcpcli-417-20261031-ae9919ae
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-isolation
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dapr-system
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dapr-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 10.233.0.1/32
    - ipBlock:
        cidr: 192.168.1.30/32
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-data
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
data:
  redis.conf: 'bind 0.0.0.0

    port 6379

    dir /data

    dbfilename dump.rdb

    aclfile /run/private/users.acl

    appendonly no

    save ""

    maxmemory 192mb

    maxmemory-policy noeviction

    '
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: mcpcli-v1-access
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
spec:
  accessControl:
    defaultAction: deny
    trustDomain: cluster.local
    policies:
    - appId: eventstore
      defaultAction: deny
      trustDomain: cluster.local
      namespace: mcpcli-417-20261031-ae9919ae
      operations:
      - name: /process
        httpVerb:
        - POST
        action: allow
      - name: /query
        httpVerb:
        - POST
        action: allow
      - name: /project
        httpVerb:
        - POST
        action: allow
      - name: /project/v2
        httpVerb:
        - POST
        action: allow
      - name: /admin/operational-index-metadata
        httpVerb:
        - POST
        action: allow
    - appId: tenants
      defaultAction: deny
      trustDomain: cluster.local
      namespace: mcpcli-417-20261031-ae9919ae
      operations:
      - name: /api/v1/commands
        httpVerb:
        - POST
        action: allow
      - name: /api/v1/queries
        httpVerb:
        - POST
        action: allow
    - appId: parties
      defaultAction: deny
      trustDomain: cluster.local
      namespace: mcpcli-417-20261031-ae9919ae
      operations:
      - name: /api/v1/queries
        httpVerb:
        - POST
        action: allow
  mtls:
    enabled: true
    sentryAddress: dapr-sentry.dapr-system.svc.cluster.local:443
    controlPlaneTrustDomain: cluster.local
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis:6379
  - name: redisPassword
    secretKeyRef:
      name: mcpcli-redis
      key: password
  - name: actorStateStore
    value: 'true'
  - name: keyPrefix
    value: name
scopes:
- eventstore
- tenants
- parties
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
spec:
  type: pubsub.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis:6379
  - name: redisPassword
    secretKeyRef:
      name: mcpcli-redis
      key: password
scopes:
- eventstore
- tenants
- parties
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-settings
  namespace: mcpcli-417-20261031-ae9919ae
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ae9919ae
data:
  appsettings.json: "{\n  \"EventStore\": {\n    \"DomainServices\": {\n      \"Registrations\"\
    : {\n        \"system|tenants|v1\": {\n          \"TenantId\": \"system\",\n \
    \         \"Domain\": \"tenants\",\n          \"Version\": \"v1\",\n         \
    \ \"AppId\": \"tenants\",\n          \"MethodName\": \"process\"\n        },\n\
    \        \"system|global-administrators|v1\": {\n          \"TenantId\": \"system\"\
    ,\n          \"Domain\": \"global-administrators\",\n          \"Version\": \"\
    v1\",\n          \"AppId\": \"tenants\",\n          \"MethodName\": \"process\"\
    \n        },\n        \"*|party|v1\": {\n          \"TenantId\": \"*\",\n    \
    \      \"Domain\": \"party\",\n          \"Version\": \"v1\",\n          \"AppId\"\
    : \"parties\",\n          \"MethodName\": \"process\"\n        }\n      }\n  \
    \  },\n    \"Publisher\": {\n      \"PubSubName\": \"pubsub\",\n      \"TopicOverrides\"\
    : {\n        \"global-administrators\": \"tenants.events\"\n      }\n    }\n \
    \ },\n  \"Authentication\": {\n    \"JwtBearer\": {\n      \"Authority\": \"\"\
    ,\n      \"Issuer\": \"mcpcli-live-tests\",\n      \"Audience\": \"hexalith-eventstore\"\
    ,\n      \"ValidAudiences\": [\n        \"hexalith-eventstore\"\n      ],\n  \
    \    \"AllowedAlgorithms\": [\n        \"HS256\"\n      ],\n      \"RequireHttpsMetadata\"\
    : false\n    }\n  }\n}"
