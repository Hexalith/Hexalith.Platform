apiVersion: v1
kind: Pod
metadata:
  name: redis
  namespace: mcpcli-417-20261031-ef5184e1
  labels:
    hexalith.com/operator-task: mcpcli-417-20261031-ef5184e1
    app: redis
spec:
  restartPolicy: Never
  serviceAccountName: mcpcli-v1
  nodeSelector:
    kubernetes.io/arch: amd64
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: redis
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command:
    - redis-server
    - /etc/redis/redis.conf
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 256Mi
    env:
    - name: REDISCLI_AUTH
      valueFrom:
        secretKeyRef:
          name: mcpcli-redis
          key: password
    readinessProbe:
      exec:
        command:
        - redis-cli
        - ping
    volumeMounts:
    - name: data
      mountPath: /data
    - name: config
      mountPath: /etc/redis
      readOnly: true
    - name: private
      mountPath: /run/private
      readOnly: true
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: task-data
  - name: config
    configMap:
      name: redis-config
  - name: private
    secret:
      secretName: mcpcli-redis
      defaultMode: 288
