apiVersion: v1
kind: ConfigMap
metadata:
  name: erasure-root-config
  namespace: erasure-root
data:
  erasure-root.hcl: |
    ui = false
    api_addr = "https://erasure-root.erasure-root.svc:8200"
    cluster_addr = "https://erasure-root-0.erasure-root.erasure-root.svc:8201"
    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_cert_file = "/bao/tls/tls.crt"
      tls_key_file = "/bao/tls/tls.key"
      tls_min_version = "tls13"
      max_request_size = 67108864
      max_request_json_memory = 134217728
      max_request_json_strings = 1000000
    }
    storage "raft" {
      path = "/bao/data"
      node_id = "erasure-root-0"
      max_entry_size = 67108864
    }
    telemetry {
      disable_hostname = true
    }
---
apiVersion: v1
kind: Service
metadata:
  name: erasure-root
  namespace: erasure-root
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: hexalith-erasure-root
  ports:
    - name: api
      port: 8200
      targetPort: 8200
    - name: cluster
      port: 8201
      targetPort: 8201
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erasure-root
  namespace: erasure-root
  labels:
    velero.io/exclude-from-backup: "true"
spec:
  serviceName: erasure-root
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hexalith-erasure-root
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hexalith-erasure-root
        hexalith.com/custody-class: A1
        velero.io/exclude-from-backup: "true"
    spec:
      serviceAccountName: erasure-root
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: quay.io/openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
          imagePullPolicy: IfNotPresent
          command: [bao]
          args: [server, -config=/bao/config/erasure-root.hcl]
          ports:
            - containerPort: 8200
              name: api
            - containerPort: 8201
              name: cluster
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: custody
              mountPath: /bao/data
            - name: config
              mountPath: /bao/config
              readOnly: true
            - name: tls
              mountPath: /bao/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: api
      volumes:
        - name: config
          configMap:
            name: erasure-root-config
        - name: tls
          secret:
            secretName: erasure-root-tls
  volumeClaimTemplates:
    - metadata:
        name: custody
        labels:
          hexalith.com/custody-class: A1
          velero.io/exclude-from-backup: "true"
      spec:
        storageClassName: erasure-root-no-backup
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
