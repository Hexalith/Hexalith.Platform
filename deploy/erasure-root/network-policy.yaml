apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erasure-root-private
  namespace: erasure-root
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              hexalith.com/erc-client: "true"
          podSelector:
            matchLabels:
              hexalith.com/erc-client: "true"
      ports:
        - port: 8200
          protocol: TCP
  egress: []
