apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erasure-root-private
  namespace: erasure-root
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hexalith
      ports:
        - port: 8200
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hexalith-erasure-root
      ports:
        - port: 8201
          protocol: TCP
  egress: []
