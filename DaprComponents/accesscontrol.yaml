# DAPR Access Control Configuration for the EventStore sidecar
# ================================================================================
# WARNING: Local development only.
# Production MUST use receiver-specific deny-by-default configs with mTLS. See deploy/dapr/ for templates.
#
# Loaded only by the eventstore sidecar; governs which CALLERS may invoke EventStore through Dapr service
# invocation. In the local Platform topology the Works domain service calls back into the EventStore command
# gateway, so `works` is the named allowed caller.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: accesscontrol
spec:
  mtls:
    enabled: true
    sentryAddress: "127.0.0.1:50001"
    controlPlaneTrustDomain: "localhost"
  accessControl:
    defaultAction: deny
    trustDomain: "public"
    policies:
      - appId: works
        defaultAction: deny
        trustDomain: "public"
        namespace: "default"
        operations:
          - name: /api/v1/commands
            httpVerb: ['POST']
            action: allow
          - name: /api/v1/commands/workload
            httpVerb: ['POST']
            action: allow
          - name: /api/v1/queries
            httpVerb: ['POST']
            action: allow
          - name: /api/v1/commands/status/*
            httpVerb: ['GET']
            action: allow
          - name: /api/v1/commands/status/workload/*/*
            httpVerb: ['GET']
            action: allow
          - name: /api/v1/streams/read
            httpVerb: ['POST']
            action: allow
          - name: /api/v1/streams/read/workload
            httpVerb: ['POST']
            action: allow
          - name: /api/v1/trusted-effects
            httpVerb: ['POST']
            action: allow
