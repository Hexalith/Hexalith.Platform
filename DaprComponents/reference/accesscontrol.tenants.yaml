# Value-free local policy template. Platform renders explicit per-receiver grants from v2 declarations.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: accesscontrol-tenants
spec:
  mtls:
    enabled: true
    sentryAddress: localhost:50001
    controlPlaneTrustDomain: localhost
  accessControl:
    defaultAction: deny
    trustDomain: public
    policies: []
