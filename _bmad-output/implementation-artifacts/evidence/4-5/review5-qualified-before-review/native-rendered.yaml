---
# Source: apphost/templates/eventstore/deployment.yaml
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "eventstore-deployment"
  labels:
    app.kubernetes.io/name: "apphost"
    app.kubernetes.io/component: "eventstore"
    app.kubernetes.io/instance: "native"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "apphost"
        app.kubernetes.io/component: "eventstore"
        app.kubernetes.io/instance: "native"
    spec:
      containers:
        - image: "qualification.invalid/eventstore@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          name: "eventstore"
          ports:
            - name: "http"
              protocol: "TCP"
              containerPort: 8080
          imagePullPolicy: "IfNotPresent"
  selector:
    matchLabels:
      app.kubernetes.io/name: "apphost"
      app.kubernetes.io/component: "eventstore"
      app.kubernetes.io/instance: "native"
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: "RollingUpdate"

