name: Current lifecycle image facts

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Read-only prerequisites for the supported Story 2.8 tuple
        required: true
        type: choice
        options: [current-image-facts]

permissions:
  contents: read

concurrency:
  group: current-image-facts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  current-image-facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the exact metadata-only selection
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: test "$SCENARIO" = current-image-facts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Check metadata authentication and digest controls offline
        run: python3 -B -m unittest discover -s scripts -p test_collect_current_image_facts.py -v
      - name: Collect only the exact registry manifests and sanitized configuration facts
        env:
          REGISTRY_READER_USERNAME: ${{ secrets.HEXALITH_CI_REGISTRY_USERNAME }}
          REGISTRY_READER_PASSWORD: ${{ secrets.HEXALITH_CI_REGISTRY_PASSWORD }}
        run: python3 -B scripts/collect_current_image_facts.py --output "$RUNNER_TEMP/story-2-8-current-image-facts"
      - name: Retain the exact source-bound metadata observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: story-2-8-current-image-facts
          path: ${{ runner.temp }}/story-2-8-current-image-facts
          if-no-files-found: error
          retention-days: 14
